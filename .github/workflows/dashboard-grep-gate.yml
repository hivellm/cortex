name: Dashboard grep gate

# Phase13a §4.3 (ADR-014) — the retention dashboard handler must
# not carry hardcoded missing-state literals. Wire-level `null`
# replaces handler-side string sentinels so the dashboard never
# claims a state it has no evidence for. This workflow is the
# load-bearing CI check for that property.

on:
  push:
    branches: [main, master, develop]
    paths:
      - "crates/cortex-api/src/dashboard/**"
      - ".github/workflows/dashboard-grep-gate.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "crates/cortex-api/src/dashboard/**"
      - ".github/workflows/dashboard-grep-gate.yml"

permissions:
  contents: read

jobs:
  grep-gate:
    name: Dashboard handler — no missing-state literals
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assert zero matches in dashboard handler module
        run: |
          set -e
          # Phase13a §4.3 grep gate. The dashboard reads only
          # `retention_sweeps` for last-run truth and surfaces
          # missing rows as wire-level `null`. The three literal
          # sentinels below must not appear in the handler module
          # under any quotation.
          if grep -nE '"never"|"n/a"|"unknown"' \
              crates/cortex-api/src/dashboard/retention.rs \
              crates/cortex-api/src/dashboard.rs; then
            echo "::error::Dashboard handler carries forbidden missing-state literal — see ADR-014 / phase13a §4.3."
            exit 1
          fi
          echo "Grep gate passed — zero matches in dashboard handler module."
