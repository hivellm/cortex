name: Coverage

# Workspace line + branch coverage via `cargo-llvm-cov`. Heavy job —
# instruments every test binary, so runs only on:
# - merges to main / master (post-merge baseline)
# - nightly 02:00 UTC (regression detection)
# - manual `workflow_dispatch` (operator-triggered)
#
# Skipped on every PR push to keep the per-PR feedback loop fast;
# the `rust-ci.yml` workflow already runs the unit suite + clippy +
# fmt on every push.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".rulebook/**"
      - ".github/workflows/codespell.yml"
      - ".github/workflows/version-coherence.yml"
      - ".github/workflows/dashboard-grep-gate.yml"
      - "packages/cortex-claude-plugin/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - name: Generate coverage (lcov)
        run: |
          cargo llvm-cov --workspace --no-fail-fast --locked \
            --lcov --output-path lcov.info
      - name: Generate coverage (summary)
        run: |
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ github.sha }}
          path: lcov.info
          if-no-files-found: warn
      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-${{ github.sha }}
          path: coverage-summary.txt
          if-no-files-found: warn
