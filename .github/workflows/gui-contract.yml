name: gui-contract

on:
  pull_request:
    paths:
      - "crates/cortex-api/**"
      - "gui/src/lib/api.ts"
      - "gui/src/lib/api.generated.ts"
      - "scripts/generate-gui-types.sh"
      - ".github/workflows/gui-contract.yml"
  push:
    branches:
      - main

jobs:
  contract:
    name: gui ↔ rust contract diff (phase14d)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: Install GUI deps
        working-directory: gui
        run: pnpm install --frozen-lockfile
      - name: Run contract gate
        working-directory: gui
        run: pnpm run check-contract
      - name: Type-check GUI
        working-directory: gui
        run: pnpm run typecheck
