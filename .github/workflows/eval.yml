name: eval

# Phase14c golden-set harness, reconciled by phase28
# (retrieval-eval-gate-live): the fixtures in
# `crates/cortex-eval/tests/golden/` are real (27-row multi-intent
# retrieval, 26-row all-kinds classification, live-harvested
# consolidation/mcp rows, synthetic access_control matrix) and the
# floors in `cortex-eval` are re-derived from the re-locked
# 2026-07-14 baseline (`crates/cortex-eval/baselines/cdc-baseline-v1.json`).
#
# NIGHTLY runs only the suites whose data prerequisites this CI stack
# can genuinely satisfy: `access_control` (pure predicate matrix, no
# stack at all) and `classification` (needs only the classifier
# worker, booted below). The other three suites (retrieval /
# consolidation / mcp_search) measure recall against the maintainer's
# LIVE corpus — turns, consolidations, and event ULIDs that exist only
# in the developer stack and cannot be reproduced from a bare checkout
# — so they stay on `workflow_dispatch` and are exercised locally per
# the golden README's curation cadence. Scheduling them here would
# just recreate the red-nightly inbox flood this workflow's history
# warns about.

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:17 UTC — offset from the top of the hour to dodge
    # the GitHub cron thundering herd.
    - cron: "17 3 * * *"

jobs:
  eval:
    name: cortex-eval ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # On the nightly schedule, run only the CI-satisfiable suites
        # (see the header comment); manual dispatch runs all five.
        # (job-level `if` cannot see `matrix.*`, hence the conditional
        # matrix expression.)
        suite: ${{ github.event_name == 'schedule' && fromJSON('["classification","access_control"]') || fromJSON('["retrieval","consolidation","classification","mcp_search","access_control"]') }}
    services:
      synap:
        image: hivehub/synap:1.0.0
        ports: ["15500:15500"]
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: cortex-dev-master-key
          MEILI_ENV: development
        ports: ["7700:7700"]
    env:
      CORTEX_GIT_SHA: ${{ github.sha }}
      MEILI_MASTER_KEY: cortex-dev-master-key
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build cortex-eval
        run: cargo build --release -p cortex-eval
      - name: Start cortex-api stack
        if: matrix.suite != 'access_control' && matrix.suite != 'classification'
        run: |
          cargo run --release -p cortex-api -- --bind 0.0.0.0:17000 &
          # Wait for cortex-api health endpoint
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:17000/v1/status >/dev/null; then break; fi
            sleep 1
          done
      - name: Start classifier worker (classification suite)
        if: matrix.suite == 'classification'
        env:
          CORTEX_CLASSIFIER_MODE: static
          CORTEX_CLASSIFIER_SYNAP_URL: http://127.0.0.1:15500
        run: |
          cargo run --release -p cortex-workers --bin classifier-worker &
          # Wait for the admin listener (hosts POST /v1/classify).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:17021/healthz >/dev/null; then break; fi
            sleep 1
          done
      - name: Fetch baseline (from main branch artifact)
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          name: eval-baseline-${{ matrix.suite }}
          branch: main
          workflow: eval.yml
          path: baseline/
      - name: Run suite (with regression gate when baseline present)
        run: |
          BASELINE_FLAG=""
          if [ -f "baseline/${{ matrix.suite }}.json" ]; then
            BASELINE_FLAG="--baseline baseline/${{ matrix.suite }}.json"
            echo "Comparing against main baseline."
          else
            echo "No baseline available — running advisory mode (acceptance floor only)."
          fi
          ./target/release/cortex-eval \
            --suite ${{ matrix.suite }} \
            --golden crates/cortex-eval/tests/golden/${{ matrix.suite }}.csv \
            --output json \
            $BASELINE_FLAG \
            > report.json
      - name: Upload report as baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline-${{ matrix.suite }}
          path: report.json
          retention-days: 90
      - name: Upload report (PR diagnostics)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: eval-pr-${{ matrix.suite }}
          path: report.json
          retention-days: 14
