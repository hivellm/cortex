name: Standalone Evaluation

# Frozen public corpus. Runtime evaluation needs no services or provider secrets.
# Historical service-stack evidence remains in Git history and legacy fixtures.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Local evaluation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: cortex
          - os: windows-latest
            executable: cortex.exe
    defaults:
      run:
        shell: bash
    env:
      CORTEX_EVAL_BINARY: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: local-eval-${{ matrix.os }}
      - name: Build standalone release
        run: cargo build --release --locked -p cortex-local --bin cortex
      - name: Check typed classification offline
        run: cargo test --locked -p cortex-local --test classification_eval
      - name: Install pinned Python lint tool
        run: python -m pip install ruff==0.14.3
      - name: Lint evaluation scripts
        run: |
          python -m ruff check scripts/evaluate_local_memory.py scripts/evaluate_local_feedback.py scripts/evaluate_local_latency.py scripts/evaluate_jev_live.py scripts/gate_local_memory.py scripts/generate_local_eval_fixtures.py scripts/local_eval_transport.py scripts/smoke_installed_local.py scripts/tests/test_*eval*.py
          python -m ruff format --check scripts/evaluate_local_memory.py scripts/evaluate_local_feedback.py scripts/evaluate_local_latency.py scripts/evaluate_jev_live.py scripts/gate_local_memory.py scripts/generate_local_eval_fixtures.py scripts/local_eval_transport.py scripts/smoke_installed_local.py scripts/tests/test_*eval*.py
      - name: Test evaluation contracts with real standalone binary
        run: python -W error::ResourceWarning -m unittest discover -s scripts/tests -p "test_*eval*.py"
      - name: Run fresh offline contract and non-regression gate
        run: |
          python scripts/gate_local_memory.py \
            --binary "$CORTEX_EVAL_BINARY" \
            --report scripts/eval-ci-report.json
      - name: Run offline synthetic feedback evaluation
        run: |
          python scripts/evaluate_local_feedback.py \
            --binary "$CORTEX_EVAL_BINARY" \
            --output scripts/feedback-eval-ci-report.json
      - name: Preserve passing and failed evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-eval-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            scripts/eval-ci-report.json
            scripts/feedback-eval-ci-report.json
          if-no-files-found: warn
          retention-days: 90
