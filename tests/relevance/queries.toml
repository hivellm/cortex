# cortex-relevance-eval — labeled query set (phase6e / F-008)
#
# Each entry pairs a query/intent/scope with one or more
# expected_doc_ids. The harness counts a hit when ANY expected id
# appears in the top-10 fused snippets — the matcher accepts the
# canonical composite id (`<repo>|<path>|<content_hash>`), an exact
# match against `repo`, `path`, `symbol`, `content_hash`, or
# `collection`, OR a substring of `path`/`symbol`. The substring
# fall-back lets curators write partial paths like
# `crates/cortex-api/src/strategies.rs` without chasing chunk hashes.
#
# Coverage: 50 entries — 10 per intent across:
#   pre_change_context · decision_lookup · similar_problems
#   law_check · explain
#
# Adding more queries: see tests/relevance/README.md.

version = 1

