[workspace]
resolver = "2"
members = [
    "crates/cortex-core",
    "crates/cortex-storage",
    "crates/cortex-ingestion",
    "crates/cortex-classifier",
    "crates/cortex-workers",
    "crates/cortex-cli",
    "crates/cortex-adapter-claude-code",
    "crates/cortex-api",
    "crates/cortex-pre-thinking",
    "crates/cortex-mcp-server",
    "crates/cortex-health",
    "crates/cortex-build",
    "crates/cortex-retention",
    "crates/cortex-claude-archive",
    "crates/cortex-consolidator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/hivellm/cortex"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ulid = { version = "1.2", features = ["serde"] }
jsonschema = { version = "0.46", default-features = false }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
once_cell = "1.21"
regex = "1.12"
tempfile = "3.27"
rusqlite = { version = "0.39", features = ["bundled", "serde_json"] }
zstd = "0.13"
flate2 = "1.0"
cron = "0.15"
tokio = { version = "1.52", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
toml = "1.1"
ignore = "0.4"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
notify = "8.2"
notify-debouncer-mini = "0.7"

synap-sdk = "0.12"
vectorizer-sdk = "3.2.0"
nexus-graph-sdk = "2.1"

# Pin rustls-webpki >= 0.103.13 to close RUSTSEC-2026-0104 (panic in CRL parsing).
# Reaches us via vectorizer-sdk -> reqwest 0.13 -> rustls-platform-verifier.
[patch.crates-io]
rustls-webpki = { git = "https://github.com/rustls/webpki", tag = "v/0.103.13" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
