[workspace]
resolver = "2"
members = [
    "crates/cortex-core",
    "crates/cortex-storage",
    "crates/cortex-ops",
    "crates/cortex-ingestion",
    "crates/cortex-classifier",
    "crates/cortex-embedder",
    "crates/cortex-graph",
    "crates/cortex-fulltext",
    "crates/cortex-bootstrap",
    "crates/cortex-adapter-claude-code",
    "crates/cortex-api",
    "crates/cortex-pre-thinking",
    "crates/cortex-mcp-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/hivellm/cortex"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ulid = { version = "1.1", features = ["serde"] }
jsonschema = { version = "0.30", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.19"
regex = "1.10"
tempfile = "3.10"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
zstd = "0.13"
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
ignore = "0.4"

synap-sdk = "0.11"
vectorizer-sdk = "3.0.3"
nexus-graph-sdk = "1.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
