[package]
name = "cortex-adapter-claude-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex Claude Code adapter: hooks + local daemon that captures Claude Code sessions and publishes envelope events to cortex-core (spec 10)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-adapter-claude"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-api = { path = "../cortex-api" }
cortex-pre-thinking = { path = "../cortex-pre-thinking" }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
