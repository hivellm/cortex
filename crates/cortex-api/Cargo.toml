[package]
name = "cortex-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex query API — hybrid retrieval (vector + keyword + graph) + RRF fusion (spec 11)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-api"
path = "src/main.rs"

[build-dependencies]
cortex-build = { path = "../cortex-build" }

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-storage = { path = "../cortex-storage" }
cortex-health = { path = "../cortex-health", features = ["client"] }
cortex-build = { path = "../cortex-build" }
cortex-retention = { path = "../cortex-retention" }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
axum-extra = { version = "0.10", features = ["query"] }
tower = { workspace = true }
tower-http = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
regex = { workspace = true }

synap-sdk = { workspace = true }
nexus-graph-sdk = { workspace = true }
vectorizer-sdk = { workspace = true }
zstd = { workspace = true }

# Phase3 §7 — opt-in dashboard auth. SQLite api_keys table via
# rusqlite (workspace), Argon2id at rest, constant-time compare,
# 32-byte OsRng key generator with Crockford base32 encoding. Wire
# format `cortex_dash_<base32>`; only the Argon2id hash persists.
rusqlite = { workspace = true }
argon2 = { version = "0.5" }
rand = { version = "0.8" }
subtle = { version = "2.6" }
data-encoding = { version = "2.7" }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
