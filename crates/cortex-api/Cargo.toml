[package]
name = "cortex-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex query API — hybrid retrieval (vector + keyword + graph) + RRF fusion (spec 11)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-api"
path = "src/main.rs"

[build-dependencies]
cortex-build = { path = "../cortex-build" }

[dependencies]
cortex-config = { path = "../cortex-config" }
cortex-core = { path = "../cortex-core" }
cortex-storage = { path = "../cortex-storage" }
cortex-health = { path = "../cortex-health", features = ["client"] }
cortex-build = { path = "../cortex-build" }
cortex-workers = { path = "../cortex-workers" }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
axum-extra = { version = "0.10", features = ["query"] }
tower = { workspace = true }
tower-http = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
regex = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

synap-sdk = { workspace = true }
nexus-graph-sdk = { workspace = true }
vectorizer-sdk = { workspace = true }
zstd = { workspace = true }

# Phase3 §7 — opt-in dashboard auth. SQLite api_keys table via
# rusqlite (workspace), Argon2id at rest, constant-time compare,
# 32-byte OsRng key generator with Crockford base32 encoding. Wire
# format `cortex_dash_<base32>`; only the Argon2id hash persists.
rusqlite = { workspace = true }
argon2 = { version = "0.5" }
rand = { version = "0.8" }
subtle = { version = "2.6" }
data-encoding = { version = "2.7" }
# Phase14d — ts-rs derive surfaces TypeScript declarations for the
# wire types. Optional, behind the `ts-export` feature so the
# production dep graph is unaffected. `chrono-impl` maps
# `DateTime<Utc>` onto a TS `string`; `serde-compat` matches the
# `#[serde(skip_serializing_if = ...)]` semantics so optional
# fields render as `T | undefined` rather than nullable.
ts-rs = { version = "10", optional = true, features = ["chrono-impl", "serde-compat"] }

[features]
default = []
# Phase14d — `cargo test --features ts-export -p cortex-api` exports
# every type that crosses the HTTP boundary into `gui-types/*.ts`
# via the `ts-rs` derive. Used by `scripts/generate-gui-types.{sh,ps1}`
# to refresh `gui/src/lib/api.generated.ts`. Gated so the production
# build does not pull `ts-rs` and the type-export `Drop` test only
# runs when the operator opts in.
ts-export = ["dep:ts-rs"]

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
