[package]
name = "cortex-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex MCP server: stdio JSON-RPC bridge from Claude Code to cortex-api/cortex-pre-thinking (spec 18)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-mcp-server"
path = "src/main.rs"

[build-dependencies]
cortex-build = { path = "../cortex-build" }

[dependencies]
cortex-api = { path = "../cortex-api" }
cortex-config = { path = "../cortex-config" }
cortex-pre-thinking = { path = "../cortex-pre-thinking" }
cortex-build = { path = "../cortex-build" }

serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
