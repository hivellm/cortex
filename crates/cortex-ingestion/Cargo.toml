[package]
name = "cortex-ingestion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex ingestion HTTP router: accepts events, redacts, archives to disk, publishes to Synap."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-ingestion"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-storage = { path = "../cortex-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
synap-sdk = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
