[package]
name = "cortex-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex graph writer: maps enriched events to Nexus nodes/edges via Cypher MERGE."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-graph-worker"
path = "src/main.rs"

[[bin]]
name = "cortex-graph-backfill"
path = "src/bin/backfill.rs"

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-classifier = { path = "../cortex-classifier" }
cortex-embedder = { path = "../cortex-embedder" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
zstd = { workspace = true }

nexus-graph-sdk = { workspace = true }
synap-sdk = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
