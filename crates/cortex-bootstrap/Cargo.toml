[package]
name = "cortex-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex bootstrap CLI: walks existing Hive repos and republishes their content as synthetic events on cortex.events.bootstrap (spec 09)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-bootstrap"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../cortex-core" }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ignore = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }

synap-sdk = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
