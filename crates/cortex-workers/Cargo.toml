[package]
name = "cortex-workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex event-pipeline workers: classifier + embedder + fulltext + graph (consolidates the four phase-1 worker crates into a single deployable)."

[lib]
path = "src/lib.rs"

# One [[bin]] per worker — same final binary names as the legacy
# crates so docker-compose / scripts keep working.
[[bin]]
name = "cortex-classifier-worker"
path = "src/bin/classifier-worker.rs"

[[bin]]
name = "cortex-embedder-worker"
path = "src/bin/embedder.rs"

[[bin]]
name = "cortex-fulltext-worker"
path = "src/bin/fulltext-indexer.rs"

[[bin]]
name = "cortex-graph-worker"
path = "src/bin/graph-writer.rs"

[[bin]]
name = "cortex-graph-backfill"
path = "src/bin/graph-backfill.rs"

[[bin]]
name = "cortex-ingestion"
path = "src/bin/cortex-ingestion.rs"

[[bin]]
name = "cortex-claude-archive"
path = "src/bin/cortex-claude-archive.rs"
required-features = ["claude-archive"]

[[bin]]
name = "cortex-consolidator"
path = "src/bin/cortex-consolidator.rs"

[[bin]]
name = "cortex-retention-sweep"
path = "src/bin/cortex-retention-sweep.rs"

[[bin]]
name = "cortex-topic-cards"
path = "src/bin/cortex-topic-cards.rs"

[features]
default = []
# phase11s §3 — claude-archive walks ~/.claude/projects/ and emits
# bootstrap envelopes. Heavy deps (indicatif, sysinfo, ignore) only
# pulled when this feature is on. Operators that never run the
# archive walker keep their default cortex-workers build lean.
claude-archive = ["dep:indicatif", "dep:sysinfo", "dep:ignore"]

[build-dependencies]
cortex-build = { path = "../cortex-build" }

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-storage = { path = "../cortex-storage" }
cortex-health = { path = "../cortex-health", features = ["server"] }
cortex-build = { path = "../cortex-build" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# Phase11s §3.2 — JWT `exp`-claim parsing for the embedder's
# Vectorizer token cache. Direct dep because base64 already lands
# transitively (vectorizer-sdk pulls 0.21).
base64 = "0.22"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
rusqlite = { workspace = true }
cron = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
zstd = { workspace = true }

vectorizer-sdk = { workspace = true }
hdbscan = { workspace = true }

# Phase11k §1.1 — graph correlation static analyzer.
# `pulldown-cmark` powers the markdown extraction pass under
# `src/graph/markdown/`; tree-sitter-rust (and the other grammars
# already declared above for the embedder's symbol chunker) drive
# the code analyzer under `src/graph/analyzer/`.
pulldown-cmark = { workspace = true }
toml = { workspace = true }
nexus-graph-sdk = { workspace = true }
synap-sdk = { workspace = true }

# Embedder tree-sitter parsers
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-md = "0.5"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"

# phase11s §3 — claude-archive optional deps.
indicatif = { version = "0.17", optional = true }
sysinfo = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
wiremock = "0.6"
