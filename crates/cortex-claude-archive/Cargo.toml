[package]
name = "cortex-claude-archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Walk Claude Code's ~/.claude/projects/*.jsonl conversation archive and emit canonical Cortex Envelopes (phase11i)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-claude-archive"
path = "src/bin/cortex-claude-archive.rs"

[dependencies]
clap = { workspace = true }
indicatif = "0.17"
cortex-core = { path = "../cortex-core" }
cortex-storage = { path = "../cortex-storage" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
zstd = { workspace = true }

# phase11i §5.2 — `tail` watcher daemon: axum HTTP health endpoint
# + sysinfo RSS sampler. The watcher itself uses a polling-based
# loop (mtime + len comparison) so we avoid the cross-platform
# pitfalls of inotify/ReadDirectoryChangesW; the sample IT in §5.3
# pins the polling cadence at 1 s.
axum = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
