[package]
name = "cortex-embedder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex embedder: chunks enriched events and writes vectors via Vectorizer SDK."

[lib]
path = "src/lib.rs"

[[bin]]
name = "cortex-embedder-worker"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-classifier = { path = "../cortex-classifier" }
cortex-storage = { path = "../cortex-storage" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }

vectorizer-sdk = { workspace = true }
synap-sdk = { workspace = true }

tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-md = "0.5"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
