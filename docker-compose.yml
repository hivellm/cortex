services:
  vectorizer:
    image: hivehub/vectorizer:3.4.0-fastembed
    container_name: cortex-vectorizer
    user: "0:0"
    working_dir: /data
    command: ["--auto-generate-jwt-secret"]
    environment:
      VECTORIZER_ADMIN_PASSWORD: ${VECTORIZER_ADMIN_PASSWORD:-cortex-dev-admin}
    networks: [cortex-net]
    ports:
      # Container's internal listen port stays at 15002 (Vectorizer
      # default); the host-facing side moved to 17001 to dodge the
      # 15xxx conflict range.
      - "${VECTORIZER_HOST_PORT:-17001}:15002"
      # Vectorizer binary RPC (v3.x default) — required by the
      # `vectorizer://` SDK transport. Faster than the REST API and
      # the canonical v3.x dial. Host port moved off 17011 → 17005:
      # 17011 is reserved for the host-side cortex-adapter-claude
      # daemon admin /healthz (CORTEX_ADAPTER_ADMIN_URL), and the
      # collision kept the adapter from binding. In-cluster consumers
      # dial `vectorizer://vectorizer:15503` over the docker network,
      # so the host-port change is host-access-only.
      - "${VECTORIZER_RPC_HOST_PORT:-17005}:15503"
    volumes:
      - vec-data:/data
      # Vectorizer 3.x writes its real persistent state (collections,
      # vectors, auth keys, snapshots) to the XDG data dir
      # (`/.local/share/vectorizer`), NOT `/data`. The `/data` mount
      # only holds `config.yml`. Without this second mount, every
      # `docker compose up` of `vectorizer` wipes every collection
      # because the container writable layer resets. Discovered
      # 2026-05-27 when post-restart coverage dropped to 2/567
      # collections.
      - vec-state:/.local/share/vectorizer
    restart: unless-stopped

  nexus:
    image: hivehub/nexus:2.3.1
    container_name: cortex-nexus
    networks: [cortex-net]
    ports:
      - "${NEXUS_HOST_PORT:-17002}:15474"
      # Nexus binary RPC — required by the nexus-graph-sdk `nexus://`
      # transport. RPC is faster than the REST `/cypher` path.
      - "${NEXUS_RPC_HOST_PORT:-17012}:15475"
    volumes:
      # Nexus 2.x uses /app/data (Dockerfile WORKDIR=/app). The
      # earlier `/data` mount was a no-op — every recreate dropped
      # the in-container /app/data tree. Fixed in phase post-2026-05-04
      # cpu incident.
      - nexus-data:/app/data
    healthcheck:
      # nexus 2.x ships without curl/wget/grep — probe via bash
      # /dev/tcp + bash regex (`[[ =~ ]]`) so we depend only on
      # bash + head which the image carries.
      test:
        - "CMD-SHELL"
        - |
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/15474 && printf "GET /health HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 && read -r status <&3 && [[ "$$status" =~ "200" ]] && exit 0; exit 1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  synap:
    image: hivehub/synap:latest
    container_name: cortex-synap
    networks: [cortex-net]
    ports:
      - "${SYNAP_HOST_PORT:-17003}:15500"
      - "${SYNAP_WS_HOST_PORT:-17013}:15501"
      - "${SYNAP_RESP_HOST_PORT:-16379}:6379"
    volumes:
      - synap-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:15500/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: cortex-meilisearch
    networks: [cortex-net]
    ports:
      - "${MEILI_HOST_PORT:-17004}:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cortex-dev-master-key}
      MEILI_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Cortex services (phase10k+ — full stack containerised so a
  # `docker compose up -d` brings the system up cleanly without
  # leaning on host-installed binaries.) Build target picks the
  # right binary out of the shared builder layer in `Dockerfile`.
  # ---------------------------------------------------------------

  # cortex-ingestion ─ POST /v1/events durable archive + bus pub.
  cortex-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      # phase11e hotfix — host's git SHA / dirty flag forwarded
      # so /healthz version block stamps real values instead of
      # `sha=unknown`. Set on the host before `docker compose build`:
      #   CORTEX_GIT_SHA=$(git rev-parse HEAD) \
      #   CORTEX_GIT_DIRTY=$(git status --porcelain | head -c1 | grep -q . && echo true || echo false) \
      #   docker compose build
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-ingestion
    image: cortex/ingestion:dev
    container_name: cortex-ingestion
    depends_on:
      synap: { condition: service_healthy }
    networks: [cortex-net]
    ports:
      - "${CORTEX_INGESTION_PORT:-17010}:17010"
    environment:
      CORTEX_INGESTION_BIND: 0.0.0.0:17010
      CORTEX_SYNAP_URL: http://synap:15500
      # Legacy name that cortex-ingestion's IngestionConfig::from_env
      # currently reads (config.rs:65). The CORTEX_SYNAP_URL above is
      # the project-namespaced canonical form; the duplicate keeps
      # the publisher live until the code fix lands.
      SYNAP_URL: http://synap:15500
      CORTEX_ARCHIVE_ROOT: /var/lib/cortex/archive
    volumes:
      # Bind-mount the host's `~/.cortex` directory so the
      # archive + metadata DB are shared with the host's CLI tools
      # and survive container recreation. ${CORTEX_HOME_HOST}
      # defaults to `${USERPROFILE}/.cortex` on Windows or
      # `${HOME}/.cortex` on Unix; override via .env when the host
      # uses a non-default location.
      - ${CORTEX_HOME_HOST:-${USERPROFILE:-${HOME}}/.cortex}:/var/lib/cortex
    restart: unless-stopped

  # cortex-classifier-worker ─ Haiku CLI fan-out for kind refinement.
  cortex-classifier-worker:
    build:
      context: .
      dockerfile: Dockerfile
      # phase11e hotfix — host's git SHA / dirty flag forwarded
      # so /healthz version block stamps real values instead of
      # `sha=unknown`. Set on the host before `docker compose build`:
      #   CORTEX_GIT_SHA=$(git rev-parse HEAD) \
      #   CORTEX_GIT_DIRTY=$(git status --porcelain | head -c1 | grep -q . && echo true || echo false) \
      #   docker compose build
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-classifier-worker
    image: cortex/classifier-worker:dev
    container_name: cortex-classifier-worker
    depends_on:
      synap: { condition: service_healthy }
      cortex-ingestion: { condition: service_started }
    networks: [cortex-net]
    ports:
      - "${CORTEX_CLASSIFIER_PORT:-17021}:17021"
    environment:
      CORTEX_CLASSIFIER_BIND: 0.0.0.0:17021
      CORTEX_CLASSIFIER_SYNAP_URL: http://synap:15500
    restart: unless-stopped

  # cortex-embedder-worker ─ chunks + Vectorizer upserts.
  cortex-embedder-worker:
    build:
      context: .
      dockerfile: Dockerfile
      # phase11e hotfix — host's git SHA / dirty flag forwarded
      # so /healthz version block stamps real values instead of
      # `sha=unknown`. Set on the host before `docker compose build`:
      #   CORTEX_GIT_SHA=$(git rev-parse HEAD) \
      #   CORTEX_GIT_DIRTY=$(git status --porcelain | head -c1 | grep -q . && echo true || echo false) \
      #   docker compose build
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-embedder-worker
    image: cortex/embedder-worker:dev
    container_name: cortex-embedder-worker
    depends_on:
      synap: { condition: service_healthy }
      vectorizer: { condition: service_started }
    networks: [cortex-net]
    ports:
      - "${CORTEX_EMBEDDER_PORT:-17022}:17022"
    environment:
      CORTEX_EMBEDDER_BIND: 0.0.0.0:17022
      CORTEX_EMBEDDER_SYNAP_URL: http://synap:15500
      # REST endpoint (15002), NOT the binary-RPC dial (vectorizer://:15503).
      # cortex's LiveVectorizerClient wraps vectorizer-sdk's HTTP
      # `VectorizerClient`, which only parses http/https; a `vectorizer://`
      # URL reaches `HttpTransport`/reqwest as an unknown scheme and fails
      # at construction ("builder error for url … /auth/login"), crash-
      # looping the worker. The RPC transport lives behind the SDK's
      # separate `rpc` client, which this worker does not wire. Matches
      # cortex-api's CORTEX_VECTORIZER_URL.
      CORTEX_EMBEDDER_VECTORIZER_URL: http://vectorizer:15002
      # phase11e §5 — credentials for the embedder's Vectorizer
      # write path. Without these, the worker hits 401 on every
      # `insert_texts` and the per-kind collections (decisions /
      # turns / memory / analyses / knowledge / learnings) are
      # never created. Same precedence as cortex-api (phase11a).
      CORTEX_EMBEDDER_VECTORIZER_USER: ${CORTEX_EMBEDDER_VECTORIZER_USER:-${CORTEX_VECTORIZER_USER:-admin}}
      CORTEX_EMBEDDER_VECTORIZER_PASSWORD: ${CORTEX_EMBEDDER_VECTORIZER_PASSWORD:-${CORTEX_VECTORIZER_PASSWORD:-cortex-dev-admin}}
      # Dim MUST match the Vectorizer's active embedding provider.
      # `vectorizer:3.4.0-fastembed` with `embedding.model:
      # "fastembed:all-MiniLM-L6-v2"` in its config.yml serves a DENSE
      # 384-dim provider (issue #306); collections created without an
      # explicit provider inherit it. 384 = all-MiniLM-L6-v2 dim — a
      # mismatch yields `Invalid dimension` on insert. (BM25-only builds
      # use 512; switch this value AND config.embedding.model together.)
      CORTEX_EMBEDDER_DIM: ${CORTEX_EMBEDDER_DIM:-384}
    restart: unless-stopped

  # cortex-fulltext-worker ─ Meili indexer.
  cortex-fulltext-worker:
    build:
      context: .
      dockerfile: Dockerfile
      # phase11e hotfix — host's git SHA / dirty flag forwarded
      # so /healthz version block stamps real values instead of
      # `sha=unknown`. Set on the host before `docker compose build`:
      #   CORTEX_GIT_SHA=$(git rev-parse HEAD) \
      #   CORTEX_GIT_DIRTY=$(git status --porcelain | head -c1 | grep -q . && echo true || echo false) \
      #   docker compose build
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-fulltext-worker
    image: cortex/fulltext-worker:dev
    container_name: cortex-fulltext-worker
    depends_on:
      synap: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    networks: [cortex-net]
    ports:
      - "${CORTEX_FULLTEXT_PORT:-17023}:17023"
    environment:
      CORTEX_FULLTEXT_BIND: 0.0.0.0:17023
      CORTEX_FULLTEXT_SYNAP_URL: http://synap:15500
      CORTEX_FULLTEXT_MEILI_URL: http://meilisearch:7700
      CORTEX_FULLTEXT_MEILI_API_KEY: ${MEILI_MASTER_KEY:-cortex-dev-master-key}
      CORTEX_FULLTEXT_BATCH: "100"
      CORTEX_FULLTEXT_WORKERS: "1"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cortex-dev-master-key}
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  # cortex-graph-worker ─ Nexus Cypher writer.
  cortex-graph-worker:
    build:
      context: .
      dockerfile: Dockerfile
      # phase11e hotfix — host's git SHA / dirty flag forwarded
      # so /healthz version block stamps real values instead of
      # `sha=unknown`. Set on the host before `docker compose build`:
      #   CORTEX_GIT_SHA=$(git rev-parse HEAD) \
      #   CORTEX_GIT_DIRTY=$(git status --porcelain | head -c1 | grep -q . && echo true || echo false) \
      #   docker compose build
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-graph-worker
    image: cortex/graph-worker:dev
    container_name: cortex-graph-worker
    depends_on:
      synap: { condition: service_healthy }
      nexus: { condition: service_healthy }
    networks: [cortex-net]
    ports:
      - "${CORTEX_GRAPH_PORT:-17024}:17024"
    environment:
      CORTEX_GRAPH_BIND: 0.0.0.0:17024
      CORTEX_GRAPH_SYNAP_URL: http://synap:15500
      CORTEX_GRAPH_NEXUS_URL: http://nexus:15474
      CORTEX_GRAPH_CYPHER_DIR: /opt/cortex/cypher
    restart: unless-stopped

  # cortex-api ─ POST /v1/query + dashboard JSON + retention scheduler.
  cortex-api:
    build:
      context: .
      dockerfile: Dockerfile
      # phase11e hotfix — host's git SHA / dirty flag forwarded
      # so /healthz version block stamps real values instead of
      # `sha=unknown`. Set on the host before `docker compose build`:
      #   CORTEX_GIT_SHA=$(git rev-parse HEAD) \
      #   CORTEX_GIT_DIRTY=$(git status --porcelain | head -c1 | grep -q . && echo true || echo false) \
      #   docker compose build
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-api
    image: cortex/api:dev
    container_name: cortex-api
    command: ["--bind", "0.0.0.0:17000"]
    depends_on:
      synap: { condition: service_healthy }
      nexus: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      vectorizer: { condition: service_started }
      cortex-ingestion: { condition: service_started }
    networks: [cortex-net]
    ports:
      - "${CORTEX_API_PORT:-17000}:17000"
    environment:
      CORTEX_HOME: /var/lib/cortex
      # archive_loader walks parquet here on boot + every 30 s and
      # stamps `extras.session_id` on every LaneHit so the dashboard
      # Conversations / Sessions panels can group by session. Without
      # this, sessions resolve to 0 even though the meili lane has
      # data — meili-loader doesn't carry session_id on its docs.
      CORTEX_ARCHIVE_ROOT: /var/lib/cortex/archive
      CORTEX_FULLTEXT_MEILI_API_KEY: ${MEILI_MASTER_KEY:-cortex-dev-master-key}
      # phase5b multi-project — tasks loader scans every listed
      # `.rulebook/` and stamps the project slug (parent dir name,
      # lowercased) on each row so the dashboard can group by repo.
      # The bind-mount below puts the host's workspace parent at
      # /workspaces inside the container, so each sibling project's
      # `.rulebook/` is reachable. Override `CORTEX_WORKSPACES_HOST`
      # to point at a different parent dir on non-default layouts.
      CORTEX_RULEBOOK_ROOTS: /workspaces/Cortex/.rulebook,/workspaces/Nexus/.rulebook,/workspaces/Synap/.rulebook,/workspaces/Vectorizer/.rulebook,/workspaces/Rulebook/.rulebook,/workspaces/Tml/.rulebook,/workspaces/HiveGPU/.rulebook,/workspaces/TmlDocs/.rulebook
      CORTEX_INGESTION_URL: http://cortex-ingestion:17010
      CORTEX_SYNAP_URL: http://synap:15500
      # Nexus transport: HTTP is stable; RPC (nexus://nexus:15475)
      # tested but nexus-graph-sdk 2.1 RPC connection does not
      # auto-recover after a slow query and subsequent calls fail
      # with `RPC id mismatch — connection is out of sync`. Stay
      # on HTTP until the SDK ships a connection pool / reconnect
      # path. See phase19 smoke notes.
      CORTEX_NEXUS_URL: http://nexus:15474
      # Vectorizer URL: cortex-api uses raw reqwest for the vector
      # lane probe + /auth/login fallback; keep HTTP here. The
      # SDK-driven embedder worker uses its own
      # `CORTEX_EMBEDDER_VECTORIZER_URL` that points at RPC.
      CORTEX_VECTORIZER_URL: http://vectorizer:15002
      # phase11v §1 — `cortex-ops consolidation-prune` reads
      # `CORTEX_EMBEDDER_VECTORIZER_URL` (with the EMBEDDER_ prefix)
      # before falling back to the literal `127.0.0.1:17001`, which
      # cannot resolve inside the cortex-api container. Mirror the
      # service URL onto the prefixed name so the prune job can log
      # in to the live Vectorizer instead of a dead loopback.
      CORTEX_EMBEDDER_VECTORIZER_URL: vectorizer://vectorizer:15503
      CORTEX_EMBEDDER_VECTORIZER_USER: ${CORTEX_VECTORIZER_USER:-${CORTEX_EMBEDDER_VECTORIZER_USER:-admin}}
      CORTEX_EMBEDDER_VECTORIZER_PASSWORD: ${CORTEX_VECTORIZER_PASSWORD:-${CORTEX_EMBEDDER_VECTORIZER_PASSWORD:-cortex-dev-admin}}
      # phase11v §2 — `consolidation-prune` reads
      # `CORTEX_FULLTEXT_MEILI_KEY` (no `_API_` infix) at
      # cortex-cli/src/bin/cortex-ops.rs:4622 and falls through to
      # `MEILI_MASTER_KEY` only when that one is unset. The compose
      # default exports `_API_KEY` (with the infix) which is read
      # by cortex-api's keyword lane. Mirror the value onto the
      # underscore-key name so the daemon-driven prune authenticates.
      CORTEX_FULLTEXT_MEILI_KEY: ${CORTEX_FULLTEXT_MEILI_API_KEY:-${MEILI_MASTER_KEY:-cortex-dev-master-key}}
      # phase11a — credentials for the vector lane's authenticated probe
      # and reactive 401 → /auth/login refresh path. Without these,
      # every search_vectors call against a JWT-required Vectorizer
      # returns 401 with no recovery (the lane lands on the no-creds
      # branch in vectorizer_lane.rs:247).
      CORTEX_VECTORIZER_USER: ${CORTEX_VECTORIZER_USER:-${CORTEX_EMBEDDER_VECTORIZER_USER:-admin}}
      CORTEX_VECTORIZER_PASSWORD: ${CORTEX_VECTORIZER_PASSWORD:-${CORTEX_EMBEDDER_VECTORIZER_PASSWORD:-cortex-dev-admin}}
      # phase11a — optional: when set to a positive integer, cortex-api
      # spawns a periodic refresh_token() loop so the cached JWT never
      # reaches the SDK after expiry. 0 / unset keeps the existing
      # reactive-on-401 path as the only refresh trigger.
      CORTEX_VECTORIZER_JWT_WARMUP_SECS: ${CORTEX_VECTORIZER_JWT_WARMUP_SECS:-0}
      # phase11e §3 — when 1, every cortex_query response carries a
      # `debug.notes[]` entry per missing collection / index instead
      # of silently swallowing the 404 into an empty hit set. Default
      # 0 keeps the response shape backwards-compatible; flip on for
      # diagnostic sessions or operators tracking ingestion gaps.
      CORTEX_QUERY_REPORT_MISSING_COLLECTIONS: ${CORTEX_QUERY_REPORT_MISSING_COLLECTIONS:-0}
      CORTEX_FULLTEXT_MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cortex-dev-master-key}
      # phase11i — restrict the /v1/health/coverage audit to the 17
      # canonical Hive repos. Without this, classifier-stamped slugs
      # (rust / python / typescript / csharp / java / go / gui /
      # dashboard / project-v / x / tests) leak in from the keyword
      # lane and inflate every backend's "missing" count.
      CORTEX_COVERAGE_SLUGS_ONLY: ${CORTEX_COVERAGE_SLUGS_ONLY:-cortex,vectorizer,vectorizersync,nexus,synap,lexum,expert,rulebook,hivehubcloud,hivegpu,compressionprompt,tml,tmldocs,tmltextmate,transmutation,transmutationlite,umicp}
      # cortex-adapter-claude lives on the HOST (Windows named pipe
      # cannot bridge into a Linux container). `host.docker.internal`
      # is Docker Desktop's reserved DNS name for the host's IP, so
      # the aggregator inside cortex-api reaches the host-side
      # adapter without hard-coding LAN addresses.
      CORTEX_ADAPTER_ADMIN_URL: http://host.docker.internal:17011/healthz
      CORTEX_CLASSIFIER_WORKER_URL: http://cortex-classifier-worker:17021/healthz
      CORTEX_EMBEDDER_WORKER_URL: http://cortex-embedder-worker:17022/healthz
      CORTEX_FULLTEXT_WORKER_URL: http://cortex-fulltext-worker:17023/healthz
      CORTEX_GRAPH_WORKER_URL: http://cortex-graph-worker:17024/healthz
      # phase11i §5.2 — comma-separated list of cortex-claude-archive
      # `:17030/healthz` endpoints. /v1/health/coverage probes each one
      # and surfaces the snapshot under `archive_watchers`. Defaults to
      # the in-compose service; multi-watcher operators add additional
      # entries via the env file.
      CORTEX_ARCHIVE_WATCHER_URLS: ${CORTEX_ARCHIVE_WATCHER_URLS:-http://cortex-claude-archive:17030}
      # phase11x — `cortex-ops memory-consolidate` resolves the
      # Claude Code memory dir from `~/.claude/projects/<slug>/memory/`.
      # Inside the container the cwd is `/opt/cortex` which would
      # produce slug `-opt-cortex` — but the host's actual project
      # slug is the slugified host path (e.g. `e--HiveLLM-Cortex` on
      # Windows). This env override pins the slug so the cron
      # finds the right dir on the mounted volume. Defaults to the
      # value the operator's host produces; if unset, the binary's
      # graceful no-op kicks in (success with `files_in=0`).
      CORTEX_AUTO_MEMORY_PROJECT: ${CORTEX_AUTO_MEMORY_PROJECT:-}
    volumes:
      # Same host bind-mount as cortex-ingestion — the daemon reads
      # the archive at boot to seed the keyword lane (drives the
      # dashboard counters) and writes its sqlite + cron-jobs DB
      # back to the same place so the host CLI sees them.
      - ${CORTEX_HOME_HOST:-${USERPROFILE:-${HOME}}/.cortex}:/var/lib/cortex
      # phase5b multi-project — bind-mount the host's workspace
      # parent so every sibling project's `.rulebook/` is visible.
      # Defaults to `..` (the directory that contains this Cortex
      # checkout); override with CORTEX_WORKSPACES_HOST in `.env` to
      # point at any other layout.
      - ${CORTEX_WORKSPACES_HOST:-..}:/workspaces:ro
      # phase11v §2 — `cortex-ops memory-consolidate` walks
      # `~/.claude/projects/*/memory/` to collapse Claude Code
      # auto-memory entries. Without this mount the binary errors
      # with `memory directory not found: /root/.claude/...` and the
      # daemon-driven weekly consolidation never runs. Read-write
      # because the consolidator rewrites merged entries in place.
      - ${CORTEX_CLAUDE_HOME_HOST:-${USERPROFILE:-${HOME}}/.claude}:/root/.claude
    restart: unless-stopped

  # phase11i §5.1 — cortex-claude-archive ─ long-running watcher
  # over the Claude Code JSONL conversation archive on the host.
  # The mount is read-only (`:ro`) so a buggy parser cannot corrupt
  # the live transcript. The watcher emits one canonical envelope
  # per turn / tool_call / agent_call into the archive sink read by
  # `cortex-api`'s archive_loader at boot, so this service feeds
  # the keyword + vector lanes without leaning on the live worker
  # pipeline being up. The host bind-mount default tracks the
  # platform-specific Claude Code data dir (Windows:
  # `${USERPROFILE}/.claude/projects`; Unix: `${HOME}/.claude/projects`).
  cortex-claude-archive:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-claude-archive
    image: cortex/claude-archive:dev
    container_name: cortex-claude-archive
    depends_on:
      synap: { condition: service_healthy }
      cortex-ingestion: { condition: service_started }
    networks: [cortex-net]
    ports:
      - "${CORTEX_CLAUDE_ARCHIVE_PORT:-17030}:17030"
    environment:
      CORTEX_CLAUDE_ARCHIVE_BIND: 0.0.0.0:17030
      CORTEX_SYNAP_URL: http://synap:15500
      CORTEX_ARCHIVE_ROOT: /var/lib/cortex/archive
    volumes:
      # Read-only mount of the host's `~/.claude/projects` JSONL
      # corpus. Override CORTEX_CLAUDE_PROJECTS_HOST in `.env` when
      # the host stores the archive elsewhere.
      - ${CORTEX_CLAUDE_PROJECTS_HOST:-${USERPROFILE:-${HOME}}/.claude/projects}:/data/claude-projects:ro
      # Same bind-mount as cortex-ingestion + cortex-api so the
      # archive sink lands in the canonical `~/.cortex/archive`
      # dir; cortex-api's archive_loader re-reads it at boot.
      - ${CORTEX_HOME_HOST:-${USERPROFILE:-${HOME}}/.cortex}:/var/lib/cortex
    restart: unless-stopped

  # phase14a §3.4 — cortex-consolidator daemon. Subscribes to the
  # Synap trigger stream (`cortex.consolidator.triggers`) and runs
  # the matching grain (session / topic / decision-trace) per
  # trigger. Reads the parquet archive + writes producer-checkpoint
  # rows back to the shared `~/.cortex/archive` bind-mount so the
  # cortex-api health endpoint (`/v1/health/consolidator`) can read
  # last-trigger timestamps. Anthropic credentials are picked up
  # from `ANTHROPIC_API_KEY`; without one the daemon falls back to
  # the `claude` CLI subprocess path (matches `run-session`).
  cortex-consolidator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CORTEX_GIT_SHA: ${CORTEX_GIT_SHA:-unknown}
        CORTEX_GIT_DIRTY: ${CORTEX_GIT_DIRTY:-false}
      target: cortex-consolidator
    image: cortex/consolidator:dev
    container_name: cortex-consolidator
    depends_on:
      synap: { condition: service_healthy }
      cortex-ingestion: { condition: service_started }
    networks: [cortex-net]
    environment:
      SYNAP_BASE_URL: http://synap:15500
      CORTEX_INGESTION_URL: http://cortex-ingestion:17010
      CORTEX_ARCHIVE_ROOT: /var/lib/cortex/archive
      CORTEX_METADATA_DB: /var/lib/cortex/metadata.sqlite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_URL: ${ANTHROPIC_API_URL:-}
    volumes:
      - ${CORTEX_HOME_HOST:-${USERPROFILE:-${HOME}}/.cortex}:/var/lib/cortex
    restart: unless-stopped

# NOTE: `cortex-adapter-claude` deliberately runs OUTSIDE this
# compose file. It listens on a unix socket (`~/.cortex/adapter-claude.sock`
# on Linux/macOS) or named pipe (`\\.\pipe\cortex-adapter-claude` on
# Windows) that the Claude Code hooks talk to — those endpoints are
# host-local and cannot be bridged into a Linux container on a
# Windows host. Run it as a per-user process on the host:
#
#     cargo install --path crates/cortex-adapter-claude-code --bin cortex-adapter-claude
#     cortex-adapter-claude            # uses ~/.cortex/adapter.toml
#
# The adapter then POSTs to the dockerised cortex-ingestion via the
# host-port forward (default http://127.0.0.1:17010). cortex-api's
# /v1/health aggregator picks it up via CORTEX_ADAPTER_ADMIN_URL.
networks:
  cortex-net:
    name: cortex-net
    driver: bridge

volumes:
  vec-data:
  # Persistent home for Vectorizer's XDG-located collection store.
  # See the inline note on the `vectorizer.volumes` block.
  vec-state:
  nexus-data:
  synap-data:
  meili-data:
  # cortex-archive + cortex-home replaced by host bind-mounts on
  # cortex-ingestion + cortex-api (see service definitions). Volumes
  # left in the file would shadow the bind-mount and reintroduce the
  # empty-archive regression.
