services:
  vectorizer:
    image: hivehub/vectorizer:3.0.0
    container_name: cortex-vectorizer
    user: "0:0"
    working_dir: /data
    command: ["--auto-generate-jwt-secret"]
    environment:
      VECTORIZER_ADMIN_PASSWORD: ${VECTORIZER_ADMIN_PASSWORD:-cortex-dev-admin}
    networks: [cortex-net]
    ports:
      # Container's internal listen port stays at 15002 (Vectorizer
      # default); the host-facing side moved to 17001 to dodge the
      # 15xxx conflict range.
      - "${VECTORIZER_HOST_PORT:-17001}:15002"
    volumes:
      - vec-data:/data
    restart: unless-stopped

  nexus:
    image: hivehub/nexus:1.15.0
    container_name: cortex-nexus
    networks: [cortex-net]
    ports:
      - "${NEXUS_HOST_PORT:-17002}:15474"
    volumes:
      - nexus-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:15474/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  synap:
    image: hivehub/synap:latest
    container_name: cortex-synap
    networks: [cortex-net]
    ports:
      - "${SYNAP_HOST_PORT:-17003}:15500"
      - "${SYNAP_WS_HOST_PORT:-17013}:15501"
      - "${SYNAP_RESP_HOST_PORT:-16379}:6379"
    volumes:
      - synap-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:15500/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: cortex-meilisearch
    networks: [cortex-net]
    ports:
      - "${MEILI_HOST_PORT:-17004}:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cortex-dev-master-key}
      MEILI_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

networks:
  cortex-net:
    name: cortex-net
    driver: bridge

volumes:
  vec-data:
  nexus-data:
  synap-data:
  meili-data:
